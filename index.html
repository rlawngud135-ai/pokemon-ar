
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마릴 포켓몬카드 AR</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: system-ui, sans-serif;
}
#status {
  position: fixed;
  top: 15px;
  left: 5%;
  width: 90%;
  z-index: 9999;
  background: rgba(0,0,0,.85);
  color: white;
  padding: 12px;
  border-radius: 12px;
  text-align: center;
  box-sizing: border-box;
  font-size: 14px;
}
#play {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  background: #ffdf48;
  padding: 15px 22px;
  border: none;
  border-radius: 30px;
  font-weight: bold;
}
#debug {
  position: fixed;
  bottom: 90px;
  left: 10px;
  z-index: 9999;
  background: rgba(0,0,0,.8);
  color: #00ff88;
  font-size: 12px;
  padding: 8px;
  white-space: pre-line;
  pointer-events: none;
}
</style>
</head>

<body>

<div id="status">AR 시작 중...</div>
<div id="debug">영상 상태 확인 중...</div>
<button id="play" type="button">영상 재생하기</button>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
  embedded
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets timeout="30000">
    <video
      id="pokemonVideo"
      src="./pokemon.mp4"
      preload="auto"
      muted
      playsinline
      webkit-playsinline
      loop
      crossorigin="anonymous">
    </video>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">


<a-box
  id="testBox"
  color="#FF0000"
  width="0.5"
  height="0.5"
  depth="0.2"
  position="0 0 0.15"
  material="shader: flat; side: double"
  visible="true">
</a-box>


  </a-entity>
</a-scene>

<script>
const video = document.querySelector("#pokemonVideo");
const target = document.querySelector("#target");
const scene = document.querySelector("a-scene");
const arVideo = document.querySelector("#arVideo");
const status = document.querySelector("#status");
const debug = document.querySelector("#debug");
const button = document.querySelector("#play");

let found = false;

function show(text) {
  status.textContent = text;
}

function updateDebug() {
  debug.textContent =
    "카드 인식: " + found +
    "\n영상 시간: " + video.currentTime.toFixed(2) +
    "\n재생 중: " + !video.paused +
    "\nReadyState: " + video.readyState +
    "\n영상 크기: " +
    video.videoWidth + "x" + video.videoHeight +
    "\n영상 오류: " +
    (video.error ? video.error.code : "없음");
}

// 진단 표시만 갱신
setInterval(updateDebug, 500);

scene.addEventListener("arReady", () => {
  show("AR 준비 완료 - 마릴 카드를 비춰주세요");
});

scene.addEventListener("arError", () => {
  show("AR 초기화 오류");
});

video.addEventListener("loadedmetadata", () => {
  show("영상 정보 로딩 완료");
});

video.addEventListener("error", () => {
  show("영상 파일 오류 - MP4 코덱 확인");
});

target.addEventListener("targetFound", async () => {
  found = true;
  show("마릴 카드 인식 성공");

  try {
    await video.play();

    if (!found) {
      video.pause();
      return;
    }

    arVideo.setAttribute("visible", true);
    show("마릴 AR 재생 중!");
  } catch (e) {
    show("영상 재생 실패: " + e.name);
  }
});

target.addEventListener("targetLost", () => {
  found = false;
  video.pause();
  arVideo.setAttribute("visible", false);
  show("카드를 다시 비춰주세요");
});

button.addEventListener("click", async () => {
  video.muted = true;

  try {
    await video.play();

    if (found) {
      arVideo.setAttribute("visible", true);
      show("마릴 AR 재생 중!");
    } else {
      video.pause();
      show("마릴 카드를 비춰주세요");
    }
  } catch (e) {
    show("재생 실패: " + e.name);
  }
});

updateDebug();
</script>

<div id="previewBox" style="
  position:fixed;
  right:10px;
  bottom:100px;
  width:110px;
  z-index:99999;
  background:#333;
  padding:5px;
  border:2px solid yellow;
">
  <div style="color:white;font-size:12px">
    원본 영상
  </div>
</div>

<script>
const preview = document.querySelector("#previewBox");
const originalVideo = document.querySelector("#pokemonVideo");

originalVideo.style.width = "100%";
originalVideo.style.height = "auto";
originalVideo.style.display = "block";

preview.appendChild(originalVideo);
</script>

</body>
</html>
